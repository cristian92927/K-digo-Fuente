name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar variables de entorno requeridas
        run: |
          : "${POSTGRES_USER:?La variable POSTGRES_USER no está definida en GitHub Secrets}"
          : "${POSTGRES_PASSWORD:?La variable POSTGRES_PASSWORD no está definida en GitHub Secrets}"
          : "${POSTGRES_DB:?La variable POSTGRES_DB no está definida en GitHub Secrets}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias backend
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Setup Node.js (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias frontend
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

  test:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias backend
        working-directory: backend
        run: npm ci

      - name: Generar cliente Prisma
        working-directory: backend
        run: npx prisma generate

      - name: Ejecutar pruebas
        working-directory: backend
        run: npm test

  build:
    name: Build imágenes Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build imagen backend
        run: docker build -t promociones-backend ./backend

      - name: Build imagen frontend
        run: docker build -t promociones-frontend ./frontend

  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Crear .env desde secrets
        run: |
          cat <<EOF > .env
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          EOF

      - name: Levantar servicios
        run: docker compose up -d --build

      - name: Esperar a que los servicios estén listos
        run: |
          echo "Esperando que el backend esté disponible..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health; then
              echo "Backend listo."
              exit 0
            fi
            echo "Intento $i/30 — esperando..."
            sleep 5
          done
          echo "ERROR: El backend no respondió a tiempo."
          docker compose logs
          exit 1

      - name: Verificar /health responde 200
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: /health respondió $STATUS en lugar de 200"
            docker compose logs
            exit 1
          fi
          echo "/health OK — respuesta: $STATUS"

      - name: Apagar servicios
        if: always()
        run: docker compose down -v
